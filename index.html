<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curve Lane Bowling</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Curve Lane <span>Bowling</span></h1>
      <div class="topbar-actions">
        <span id="frame-indicator">Frame 1 / 10</span>
        <label class="oil-toggle">
          <input type="checkbox" id="dynamic-oil-toggle" checked />
          Dynamic Transition
        </label>
        <button id="reset-lane-btn" class="btn btn-ghost">Reset Lane</button>
        <button id="new-game-btn" class="btn btn-ghost">New Game</button>
      </div>
    </header>

    <div id="scoreboard" class="scoreboard"></div>

    <main class="playfield">
      <div class="canvas-wrap">
        <canvas id="lane-canvas" width="480" height="720"></canvas>
        <canvas id="pin-inset-canvas" class="pin-inset" width="180" height="150"></canvas>
      </div>

      <div class="hud">
        <div id="message" class="message">Set your POWER — click/tap or press SPACE to lock it in</div>

        <div class="meter-block" id="meter-power">
          <div class="meter-label">POWER</div>
          <div class="meter-track">
            <div class="meter-fill" id="fill-power"></div>
            <div class="meter-cursor" id="cursor-power"></div>
          </div>
        </div>

        <div class="meter-block" id="meter-accuracy">
          <div class="meter-label">ACCURACY</div>
          <div class="meter-track">
            <div class="meter-zone" id="zone-accuracy"></div>
            <div class="meter-fill" id="fill-accuracy"></div>
            <div class="meter-cursor" id="cursor-accuracy"></div>
          </div>
        </div>

        <div class="meter-block" id="meter-spin">
          <div class="meter-label">SPIN</div>
          <div class="meter-track">
            <div class="meter-mid"></div>
            <div class="meter-fill" id="fill-spin"></div>
            <div class="meter-cursor" id="cursor-spin"></div>
          </div>
        </div>

        <button id="action-btn" class="btn btn-primary">LOCK POWER</button>

        <div class="last-roll-stats" id="last-roll-stats"></div>
      </div>
    </main>

    <footer class="foot-note">
      Tap the button (or press <kbd>Space</kbd>) three times per roll to lock Power, then Accuracy, then Spin.
      Timing near the center of each bar is safest — the edges are riskier but more rewarding.
    </footer>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
